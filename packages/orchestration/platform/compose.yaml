# Experimental development dependencies only: all published ports are loopback-bound.
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: rae, POSTGRES_PASSWORD: rae-dev-only, POSTGRES_DB: rae_platform }
    ports: ["127.0.0.1:5432:5432"]
    tmpfs: [/tmp]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: "${RAE_DEV_MINIO_ACCESS_KEY:?set RAE_DEV_MINIO_ACCESS_KEY}", MINIO_ROOT_PASSWORD: "${RAE_DEV_MINIO_SECRET_KEY:?set RAE_DEV_MINIO_SECRET_KEY}" }
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/rae-artifacts && mc version enable local/rae-artifacts"]
    environment: { MINIO_ROOT_USER: "${RAE_DEV_MINIO_ACCESS_KEY:?set RAE_DEV_MINIO_ACCESS_KEY}", MINIO_ROOT_PASSWORD: "${RAE_DEV_MINIO_SECRET_KEY:?set RAE_DEV_MINIO_SECRET_KEY}" }
    depends_on: [minio]
