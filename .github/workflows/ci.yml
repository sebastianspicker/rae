name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.19.0"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.6"
      - name: Install GNU Bash 5.3+
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install bash
          /home/linuxbrew/.linuxbrew/bin/bash --version
          /home/linuxbrew/.linuxbrew/bin/bash -c \
            '((BASH_VERSINFO[0] > 5 || (BASH_VERSINFO[0] == 5 && BASH_VERSINFO[1] >= 3)))'
      - name: Assert Python runtime
        run: |
          python -c 'import sys; assert sys.version_info[:3] == (3, 14, 6), sys.version'
      - name: Install Python verification dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Install CLI dependencies
        run: sudo apt-get update && sudo apt-get install -y git-filter-repo jq ripgrep shellcheck
      - name: Verify
        shell: /home/linuxbrew/.linuxbrew/bin/bash {0}
        run: ./scripts/verify.sh
