[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
  ".git",
  ".pipeline",
  ".runtime",
  "archive",
  "build",
  "dist",
  "node_modules",
  "site",
]

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "C90",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PERF",
  "PIE",
  "PL",
  "RET",
  "RUF",
  "S",
  "SIM",
  "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 8
max-returns = 8
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["PLR2004", "S101", "S603", "S607"]
"tests/**/*.py" = ["PLR2004", "S101", "S603", "S607"]
