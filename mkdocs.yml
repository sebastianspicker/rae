site_name: RAE
site_description: Reliable Agentic Engineering
repo_name: rae
repo_url: https://github.com/sebastianspicker/rae
theme:
  name: material
  logo: assets/brand/rae-mark.svg
  favicon: assets/brand/rae-mark.svg
  font: false
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js
extra_css:
  - stylesheets/brand.css
exclude_docs: |
  agent/
  archive/
nav:
  - Home: INDEX.md
  - Tutorials:
      - Autonomous Code Change: tutorials/autonomous-code-change.md
      - First Pipeline: tutorials/first-pipeline.md
      - First Ralph Run: tutorials/first-ralph-run.md
      - First Profile Install: tutorials/first-profile-install.md
  - How-To:
