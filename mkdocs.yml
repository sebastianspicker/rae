site_name: RAE
site_description: Reliable Agentic Engineering
repo_name: rae
repo_url: https://github.com/sebastianspicker/rae
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
nav:
  - Home: INDEX.md
  - Tutorials:
      - First Pipeline: tutorials/first-pipeline.md
      - First Ralph Run: tutorials/first-ralph-run.md
      - First Profile Install: tutorials/first-profile-install.md
  - How-To:
